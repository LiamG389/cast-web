<main class="app">
<header><div class="brand"><svg aria-hidden="true"><use href="#i-cast"/></svg>Cast</div><div class="header-actions"><button class="device-pill" id="device-picker" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#i-cast"/></svg><span id="device-name">Choose a TV</span></button><button type="button" class="icon-button" id="settings-toggle" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l.6 2.6a8 8 0 0 1 1.7 1L19 5l2 3.5-1.9 1.8a8 8 0 0 1 0 2l1.9 1.8-2 3.5-2.7-.7a8 8 0 0 1-1.7 1L14 21h-4l-.6-3.1a8 8 0 0 1-1.7-1l-2.7.7-2-3.5 1.9-1.8a8 8 0 0 1 0-2L3 8.5 5 5l2.7.6a8 8 0 0 1 1.7-1L10 2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="11.5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><button class="icon-button" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"><svg aria-hidden="true"><use id="theme-icon" href="#i-moon"/></svg></button></div></header>
<section class="search-area" aria-label="Find videos"><form id="scan-form" class="search"><svg aria-hidden="true"><use href="#i-link"/></svg><label class="sr-only" for="page-url">Video page URL</label><input id="page-url" type="url" inputmode="url" placeholder="Paste a video page or .m3u8 link" required autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"><button id="scan" type="submit" aria-label="Find videos"><svg aria-hidden="true"><use id="scan-icon" href="#i-search"/></svg></button></form><div class="scan-line" id="scan-line"><span id="scan-status" role="status" aria-live="polite">Ready</span></div></section>
<section class="library" aria-label="Videos"><div class="section-heading"><div class="library-tabs" role="group" aria-label="Video library">
  <button type="button" id="videos-tab" aria-pressed="true">Videos</button>
  <button type="button" id="remuxes-tab" aria-pressed="false">Remuxes</button>
  <span class="count" id="video-count">1</span>
</div><label class="duration-option"><input type="checkbox" id="show-duration" checked><span>Duration</span></label><button class="icon-button" id="copy-link" aria-label="Copy selected video link"><svg aria-hidden="true"><use href="#i-copy"/></svg></button></div><div class="tracks" id="tracks"></div></section>
<footer class="player"><div class="now"><div class="art"><svg aria-hidden="true"><use href="#i-play"/></svg></div><div class="now-text"><strong id="now-title">Big Buck Bunny</strong><span id="now-subtitle">Test video</span></div><button id="track-picker" class="row-cast" disabled>Tracks</button></div><div class="seek-controls"><label class="sr-only" for="seek">Playback position</label><div class="seek-row"><button type="button" class="skip-button" id="skip-back" aria-label="Back 10 seconds" disabled>−10s</button><input type="range" id="seek" min="0" max="1" step="1" value="0" disabled><button type="button" class="skip-button" id="skip-forward" aria-label="Forward 10 seconds" disabled>+10s</button></div><div class="seek-times"><span id="seek-current">0:00</span><span id="seek-end">—</span></div></div><div class="playback-controls"><button class="cast-button" id="cast" disabled><svg aria-hidden="true"><use href="#i-cast"/></svg><span id="cast-label">Cast video</span></button><button class="transport" id="toggle-play" aria-label="Play" disabled><svg aria-hidden="true"><use id="play-icon" href="#i-play"/></svg></button><button class="transport" id="stop" aria-label="Stop" disabled><svg aria-hidden="true"><use href="#i-stop"/></svg></button></div><div class="audio-controls"><button class="icon-button" id="mute" aria-label="Mute" aria-pressed="false" disabled><svg aria-hidden="true"><use id="mute-icon" href="#i-volume"/></svg></button><label class="sr-only" for="volume">TV volume</label><input type="range" id="volume" min="0" max="100" step="1" value="0" disabled><output id="volume-value" for="volume">—</output></div><div class="status-row"><p class="status" id="status" role="status" aria-live="polite">Connecting…</p><span class="version" id="version" aria-label="App version">v0.2.31</span></div><div class="player-links">
  <a class="text-action" id="open-remux" target="_blank" rel="noopener" hidden>Open MP4</a>
  <button type="button" class="text-action" id="cast-diagnostics" hidden>Copy diagnostics</button>
</div></footer>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <div class="sheet-head">
    <h2 id="settings-title">Settings</h2>
    <button type="button" class="icon-button" id="close-settings" aria-label="Close settings">
      <svg aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <section class="details-body" aria-labelledby="cast-mode-title">
    <h3 id="cast-mode-title">HLS playback</h3>
    <div class="settings-devices" id="settings-devices"></div>
    <p class="settings-status" id="settings-status" role="status" hidden></p>
  </section>
</dialog>
<dialog id="device-dialog" aria-labelledby="device-title"><div class="sheet-head"><h2 id="device-title">Cast to</h2><div class="sheet-actions"><button class="icon-button" id="refresh" aria-label="Refresh devices"><svg aria-hidden="true"><use href="#i-refresh"/></svg></button><button class="icon-button" id="close-devices" aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div></div><div class="device-list" id="device-list"></div><div class="disconnect-row"><button class="row-cast" id="disconnect" type="button" disabled>Disconnect from TV</button></div></dialog>
<dialog id="tracks-dialog" aria-labelledby="tracks-title"><div class="sheet-head"><h2 id="tracks-title">Audio &amp; subtitles</h2><button class="icon-button" id="close-tracks" aria-label="Close audio and subtitles"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="details-body track-fields"><label for="audio-track">Audio</label><select id="audio-track" disabled><option>No alternate audio</option></select><label for="subtitle-track">Subtitles</label><select id="subtitle-track" disabled><option>No subtitles</option></select></div></dialog>
<dialog id="details-dialog" aria-labelledby="details-title">
  <div class="sheet-head">
    <h2 id="details-title">Video details</h2>
    <button type="button" class="icon-button" id="close-details" aria-label="Close video details">
      <svg aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="details-body">
    <h3 class="details-name" id="details-name"></h3>
    <div class="details-facts">
      <span id="details-meta"></span>
      <span id="details-duration" hidden></span>
    </div>
    <div class="details-buttons">
      <button id="details-copy" type="button" class="row-cast">
        <svg aria-hidden="true"><use href="#i-copy"/></svg>
        Copy link
      </button>
      <a id="details-open" class="row-cast" target="_blank" rel="noopener noreferrer">Open source</a>
    </div>
    <p id="details-feedback" role="status" hidden></p>
    <button type="button" class="row-cast details-direct" id="direct-hls" hidden>
      <svg aria-hidden="true"><use href="#i-cast"/></svg>Cast HLS directly
    </button>
    <details class="details-section" id="details-link-section">
      <summary>Full URL</summary>
      <textarea id="details-url" aria-label="Full URL" readonly rows="3" spellcheck="false"></textarea>
    </details>
    <details class="details-section" id="details-advanced" hidden>
      <summary>Advanced casting</summary>
      <div class="advanced-actions">
        <button type="button" class="row-cast" id="swift-autoplay">Test Swift autoplay</button>
      </div>
    </details>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body></html>
